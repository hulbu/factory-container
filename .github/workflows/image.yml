# The image: checked and built for amd64 and arm64 on every pull request, never pushed from one.
# Published to ghcr.io/hulbu/factory-container only from a tag (v*), which only a maintainer pushes.
name: image

on:
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x entrypoint/start.sh bin/hulbu test/start.test.sh
      - name: The release check's tests
        run: node --test test/verify-release.test.mjs
      - name: The entrypoint's tests (one case reads releases.hulbu.com)
        run: bash test/start.test.sh
      - name: The compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.practice.yml config -q
      - name: The Dockerfile (checks only, builds nothing)
        run: docker buildx build --check .

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            expected: linux-x64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # native arm64, no emulation
            expected: linux-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: hulbu-factory:ci
      - name: The programs in the image run
        run: |
          for program in "node --version" "npm --version" "git --version" "gh --version" "bwrap --version"; do
            # shellcheck disable=SC2086
            docker run --rm --entrypoint "" hulbu-factory:ci $program
          done
          test "$(docker run --rm --entrypoint "" hulbu-factory:ci id -u)" = 10001
      - name: The release check's tests, inside the image
        run: docker run --rm --entrypoint "" -v "$PWD:/repository:ro" -w /repository hulbu-factory:ci node --test test/verify-release.test.mjs
      - name: The entrypoint against releases.hulbu.com, as compose runs it (a minute at most)
        env:
          EXPECTED: ${{ matrix.expected }}
        run: |
          docker run -d --name start-check --init --read-only --tmpfs /tmp:rw,exec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true hulbu-factory:ci >/dev/null
          # Until the first Linux release it must say so and start nothing; afterwards it must install the program.
          found=no
          for _ in $(seq 60); do
            if docker logs start-check 2>&1 | grep -F -e "has no HulbuFactory build for $EXPECTED yet" -e "is installed." >/dev/null; then
              found=yes
              break
            fi
            sleep 1
          done
          docker logs start-check
          docker rm -f start-check >/dev/null
          test "$found" = yes
      - name: Size
        run: |
          {
            echo "### ${{ matrix.platform }}"
            echo
            echo "Image size on disk: $(docker image inspect --format '{{.Size}}' hulbu-factory:ci | numfmt --to=iec)"
            echo
            echo '```'
            docker history --format '{{.Size}}\t{{.CreatedBy}}' hulbu-factory:ci | cut -c1-150
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ghcr.io/hulbu/factory-container:${{ github.ref_name }}
